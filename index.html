<!DOCTYPE html>
<html>
<head>
  <title>MyBanking App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Welcome to MyBank</h1>
    <input type="text" id="username" placeholder="Your name">
    <input type="number" id="initialBalance" placeholder="Starting balance">
    <button onclick="createAccount()">Create Account</button>

    <h2 id="greeting"></h2>
    <p>Balance: ₹<span id="balance">0</span></p>

    <input type="number" id="amount" placeholder="Amount">
    <button onclick="deposit()">Deposit</button>
    <button onclick="withdraw()">Withdraw</button>

    <h3>Transaction History</h3>
    <ul id="history"></ul>
  </div>
  <script src="bank.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <div id="qrContainer">
  <h3>Scan to Deposit ₹100</h3>
  <canvas id="qrCode"></canvas>
</div>
  <button onclick="qrDeposit()">I’ve scanned the QR</button>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <div id="reader" style="width:300px;"></div>
  <button onclick="startScanner()">Scan QR with Webcam</button>
  
</body>
</html>
<script src="https://unpkg.com/html5-qrcode"></script>
<div id="reader" style="width:300px;"></div>
<button onclick="startScanner()">Scan QR to Pay</button>
